<div class="container">
    <div>
      <h2>Modifier une Université :</h2>             
    </div>
         <form >         
             <div  class="col-sm-2 col-md-2 col-lg-2">
               <label >ID Université</label>
               <input  readonly  type="text"  [(ngModel)]="currentUniversite.idUniversite"  
                   name="idUniversite" class="form-control">
              </div>
         
             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Nom université</label>
               <input  type="text"[(ngModel)]= "currentUniversite.nomUniversite"  
                   name="nomUniversite" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Prix université</label>
           <input type="number"   [(ngModel)]= "currentUniversite.prixUniversite"  
                   name="prixUniversite" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
                 <label >Date création</label>
                <input  type="date"  [ngModel]="currentUniversite.dateCreation | date: 'yyyy-MM-dd'" 
                   (ngModelChange)=" currentUniversite.dateCreation= $event"   name="dateCreation" 
                   class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
              <label>Système</label>
              <select class="form-control form-control-lg" id="idSysteme" name="idSysteme" [(ngModel)]="updatedSystemeId">
                @for(systeme of systemes; track systeme.idSysteme)
                {
                  <option [ngValue]="systeme.idSysteme">  {{systeme.nomSysteme}} </option>
                 }
             </select>                  
             </div>
        
             
              <div class="mt-2">
<button type="submit"  (click)="updateUniversite()" class="btn btn-success">Modifer</button>
              </div>  
         </form>
</div>
